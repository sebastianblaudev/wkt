<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VANT // SECURE OPERATIONS</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="landing.css">
    <link rel="icon" type="image/png" href="/logo.png">
</head>

<body>
    <!-- Initial Loader -->
    <div id="loader" class="loader-overlay">
        <div class="loader-content">
            <img src="/logo.png" alt="VANT" class="loader-logo">
            <div class="loader-bar"></div>
            <div class="loader-status">INITIALIZING SECURE PROTOCOLS...</div>
        </div>
    </div>

    <!-- Header -->
    <header class="landing-header">
        <div class="header-logo">
            <img src="/logo.png" alt="VANT">
        </div>
        <button class="access-btn">INSTALL APK</button>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-slider">
            <div class="hero-slide active" style="background-image: url('/use-case-vip.jpg')"></div>
            <div class="hero-slide" style="background-image: url('/use-case-hero-2.jpg')"></div>
            <div class="hero-slide" style="background-image: url('/use-case-hero-3.jpg')"></div>
        </div>

        <div class="hero-content">
            <div class="hero-tagline">TACTICAL COMMUNICATION SYSTEMS</div>
            <h1 class="hero-title">SECURE<br>OPERATIONS<span style="color: var(--brand-accent)">.</span></h1>
            <p class="hero-desc">The standard for elite organizations. Encrypted. Invisible. Immediate.</p>
            <button class="cta-btn download-apk" data-apk="/download/apk">DOWNLOAD APK</button>
        </div>
    </section>

    <!-- Invite Section -->
    <section class="invite-section">
        <h2 class="section-title">INITIATE OPERATION</h2>
        <p class="section-subtitle">Enter your operation credentials</p>
        <form class="invite-form" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="opId">Operation ID</label>
                <input type="text" id="opId" placeholder="e.g. delta-force-ops" required>
            </div>
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="cta-btn" id="login-btn">ACCESS OPERATION</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="landing-footer">
        <div class="footer-copy">© 2026 VANT SYSTEMS. ALL RIGHTS RESERVED.</div>
        <div class="footer-links">
            <a href="#" class="footer-link">PRIVACY</a>
            <a href="#" class="footer-link">TERMS</a>
            <a href="#" class="footer-link">CONTACT</a>
        </div>
    </footer>

    <script>
        // Initial Loader
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.classList.add('fade-out');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 1500);
            }, 1000);
        });

        // APK Download
        document.querySelectorAll('.download-apk').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const apkUrl = this.dataset.apk;
                const tempLink = document.createElement('a');
                tempLink.href = apkUrl;
                tempLink.download = 'walkie-talkie.apk';
                tempLink.click();
            });
        });

        // Login function
        document.getElementById('login-btn').addEventListener('click', function(e) {
            const opId = document.getElementById('opId').value.trim();
            const password = document.getElementById('password').value.trim();
            if (opId && password) {
                this.innerText = 'AUTHENTICATING...';
                this.disabled = true;
                setTimeout(() => {
                    window.location.href = '/admin?op=' + encodeURIComponent(opId);
                }, 1000);
            }
        });

        // Form validation
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value.trim()) {
                    this.classList.add('has-value');
                } else {
                    this.classList.remove('has-value');
                }
            });
        });
    </script>
</body>
</html>
